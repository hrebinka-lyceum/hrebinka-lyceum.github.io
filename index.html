<title>Розклад уроків</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📚</text></svg>'>
<meta name="color-scheme" content="light dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Свіжий розклад важливіший за економію трафіку: браузер (а надто телефон)
   любить показати збережену копію сторінки. Тому з сайту відкриваємо її раз із
   міткою ?v=…, і браузер мусить піти по файл заново.
   ⚠ Мітку саме ЗАМІНЮЄМО (`set`), а не дописуємо: інакше на адресі зі старою
   міткою кожне оновлення додавало нову (?v=1&v=2&v=3…), бо перевірка бачила
   першу — стару — і знову вважала сторінку несвіжою. Плюс запобіжник: якщо
   щойно оновлювали, другий раз не чіпаємо — на випадок, коли сервер губить
   параметри й сторінка інакше ходила б по колу.
   Файл із диска (file://) кеш не турбує — там нічого не робимо. */
(function(){
  if (!/^https?:$/.test(location.protocol)) return;
  var q = new URLSearchParams(location.search);
  var v = Number(q.get("v"));
  if (v && Date.now() - v < 3600000) return;
  var last = 0;
  try { last = Number(sessionStorage.getItem("bustedAt") || 0); } catch (e) {}
  if (Date.now() - last < 10000) return;
  try { sessionStorage.setItem("bustedAt", String(Date.now())); } catch (e) {}
  q.set("v", Date.now());
  location.replace(location.pathname + "?" + q.toString() + location.hash);
})();
</script>
<script>
/* Тема — ДО першого відмальовування, інакше сторінка блимне світлим.
   Пріоритет: збережений вибір користувача (cookie) → тема системи. */
(function(){
  var saved = document.cookie.match(/(?:^|;\s*)theme=(light|dark)/);
  var dark  = saved ? saved[1] === "dark"
                    : !!(window.matchMedia
                         && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
<style>
/* Тему завжди ставить скрипт у <head> — атрибутом data-theme на <html>.
   Тому темна палітра живе в ОДНОМУ місці: не треба дублювати її ще й у
   @media (prefers-color-scheme), де копії з часом розходяться. */
:root{
  color-scheme:light;
  --bg:#f4f6f9; --card:#fff; --ink:#1d2430; --muted:#6b7684; --line:#dde3ea;
  --accent:#2f6fd0; --accent-soft:#e8f0fc; --now:#fff3cd; --now-line:#e0a800;
  --sub:#e8f7ee; --sub-ink:#1c7a43; --warn:#fff8e1; --warn-line:#f0c000;
  --radius:12px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151a21; --card:#1d242e; --ink:#e8ecf1; --muted:#9aa6b4; --line:#2c3642;
  --accent:#6ea8f0; --accent-soft:#22303f; --now:#3d3520; --now-line:#c9a227;
  --sub:#1e3a2c; --sub-ink:#7fd3a4; --warn:#3a3320; --warn-line:#c9a227;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1400px;margin:0 auto;padding:12px}

/* ── Шапка ─────────────────────────────────────────────── */
header{margin-bottom:12px}
header .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0 0 4px}
.now-line{font-size:13px;color:var(--muted)}
.now-line b{color:var(--accent)}
.themebtn{
  flex:0 0 auto; width:38px; height:38px; padding:0; line-height:1; font-size:17px;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; cursor:pointer;
}
.themebtn:hover{border-color:var(--accent)}
.themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Банер оголошення ──────────────────────────────────── */
.banner{
  background:var(--warn); border:1px solid var(--warn-line); border-left-width:4px;
  border-radius:var(--radius); padding:11px 13px; margin:0 0 12px; font-size:15px;
  display:flex; gap:9px; align-items:flex-start;
}
.banner .ico{flex:0 0 auto;font-size:17px;line-height:1.3}
.banner span:last-child{white-space:pre-wrap}

/* ── Вкладки ───────────────────────────────────────────── */
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{
  flex:0 0 auto; padding:9px 14px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); border-radius:999px; font-size:14px; cursor:pointer; white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* ── Панель пошуку ─────────────────────────────────────── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.search{position:relative;margin-bottom:12px}
.search input{
  width:100%; padding:12px 14px; font-size:16px; /* 16px — щоб iOS не зумив */
  border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);
}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.dd{
  position:absolute; z-index:30; left:0; right:0; top:calc(100% + 4px);
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  max-height:min(48vh,320px); overflow:auto; box-shadow:0 8px 24px rgba(0,0,0,.12);
}
.dd:empty{display:none}
.dd div{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:15px}
.dd div:last-child{border-bottom:0}
.dd div:hover,.dd div.on{background:var(--accent-soft)}
.hint{color:var(--muted);font-size:14px;padding:6px 2px}

/* ── Загальна таблиця (як в експорті XLSX) ─────────────── */
.scroller{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-size:13px}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 5px;text-align:center;white-space:nowrap}
thead th{
  position:sticky; top:0; z-index:20; background:var(--card);
  font-weight:600; font-size:12px; vertical-align:bottom; line-height:1.2;
}
/* Прізвища вчителів — вертикально, знизу вгору (як у XLSX).
   ⚠ Обертаємо ТЕКСТ, а не комірку: transform на <th> повернув би й межі, і
   лінія-розділювач опинилася б зліва — не над своїм стовпцем. */
thead th.tcol{
  height:140px; min-width:30px; max-width:30px;
  padding:6px 2px; vertical-align:bottom; text-align:center; font-weight:600;
}
thead th.tcol .tname{
  display:inline-block; writing-mode:vertical-rl; transform:rotate(180deg);
  white-space:nowrap;
}
thead th.corner{z-index:25; min-width:26px; padding:6px 3px}
td.day,th.day{
  position:sticky; left:0; z-index:15; background:var(--card);
  writing-mode:vertical-rl; transform:rotate(180deg);
  font-weight:700; font-size:12px; letter-spacing:.08em; width:26px; min-width:26px;
}
td.num,th.num{
  position:sticky; left:26px; z-index:15; background:var(--card);
  width:26px; min-width:26px; font-weight:600; color:var(--muted);
}
/* Розділювач груп учителів — жирна вертикальна лінія (як у XLSX) */
th.grp,td.grp{border-right:2px solid var(--ink)}
tbody tr.now td{background:var(--now)}
tbody tr.now td.num{box-shadow:inset 3px 0 0 var(--now-line)}
tr.daysep td{border-top:2px solid var(--ink)}
/* Клікабельні імена: колір основного тексту (у темній темі — білий) + напівжирний.
   Синій на темному тлі читався погано. Підкреслення лишаємо як підказку, що це
   посилання, але робимо його неяскравим; наведення/дотик підсвічує акцентом.
   var(--ink) замість literal white — інакше у світлій темі текст зник би. */
.cls,.tname{
  color:var(--ink); font-weight:700; cursor:pointer;
  text-decoration:underline; text-decoration-color:var(--line);
  text-decoration-thickness:1px; text-underline-offset:2px;
}
.cls:hover,.tname:hover,.cls:active,.tname:active{
  color:var(--accent); text-decoration-color:var(--accent);
}
.badge{
  display:block;font-size:9px;line-height:1.3;margin-top:1px;
  background:var(--sub);color:var(--sub-ink);border-radius:4px;padding:0 3px;font-weight:700;
}
.gone{text-decoration:line-through;color:var(--muted)}
.sep{color:var(--muted);margin:0 3px}

/* ── Особистий розклад (вчитель / клас) ────────────────── */
.who{font-size:17px;font-weight:700;margin:2px 0 10px}
.daycard{margin-bottom:14px}
.daycard h3{
  font-size:14px;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
}
table.pers{width:100%;table-layout:fixed;font-size:15px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.pers th{background:var(--accent-soft);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.pers th,table.pers td{text-align:left;white-space:normal;padding:7px 9px;line-height:1.35}
table.pers td.t{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
table.pers td.n{white-space:nowrap;color:var(--muted);text-align:center}
/* Кожен день — ОКРЕМА таблиця, тож при автоматичній розкладці ширина колонки
   залежить від найдовшого тексту саме в тому дні, і стовпці днів «їдуть» один
   відносно одного. `table-layout:fixed` (вище) + однакові ширини вирівнюють дні. */
table.pers th:nth-child(1),table.pers td:nth-child(1){width:64px}
table.pers th:nth-child(2),table.pers td:nth-child(2){width:42px}
table.pers.tv th:nth-child(3),table.pers.tv td:nth-child(3){width:92px}
table.pers.cv th:nth-child(4),table.pers.cv td:nth-child(4){width:34%}
table.pers tr.now td{background:var(--now)}
table.pers tr.now td.n{box-shadow:inset 3px 0 0 var(--now-line);font-weight:700;color:var(--ink)}
.empty{color:var(--muted);padding:8px 2px}
.back{
  display:inline-block;margin-bottom:10px;padding:7px 12px;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;
}
footer{color:var(--muted);font-size:12px;text-align:center;padding:16px 4px 24px}


@media (max-width:640px){
  .wrap{padding:8px}
  h1{font-size:19px}
  thead th.tcol{height:130px;min-width:28px;max-width:28px;font-size:11px}
  table{font-size:12px}
  th,td{padding:3px 4px}
  table.pers th,table.pers td{padding:7px 8px}
  /* На вузькому екрані фіксовані піксельні ширини з'їли б «Предмет» */
  table.pers th:nth-child(1),table.pers td:nth-child(1){width:52px}
  table.pers th:nth-child(2),table.pers td:nth-child(2){width:30px}
  table.pers.tv th:nth-child(3),table.pers.tv td:nth-child(3){width:64px}
  table.pers.cv th:nth-child(4),table.pers.cv td:nth-child(4){width:38%}
  .scroller{max-height:78vh}
}
/* Десктоп: щільніші рядки — колонки часу/№ та класів займають менше висоти */
@media (min-width:641px){
  .scroller{max-height:80vh}
  th,td{padding:2px 6px}
  td.day,td.num{padding:2px 4px}
  table.pers th,table.pers td{padding:3px 10px;line-height:1.3}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="hrow">
    <div>
      <h1>📚 Розклад уроків</h1>
      <div class="now-line" id="nowLine"></div>
    </div>
    <button id="theme" class="themebtn" type="button"></button>
  </div>
</header>

<div id="banner"></div>

<div class="tabs" role="tablist">

  <button class="tab" role="tab" data-tab="teacher" aria-selected="false">Пошук за вчителем</button>
  <button class="tab" role="tab" data-tab="class" aria-selected="false">Пошук за класом</button>
</div>

<!-- Загальний розклад -->

  </div>
</section>

<!-- Пошук за класом -->
<section id="view-class" hidden>

    <div id="outClass"><div class="hint">Введіть назву класу — зі списку оберіть потрібний.</div></div>
  </div>
</section>

<footer id="stamp"></footer>

</div>

/* Структура:
   teachers : [{id, name}]
   classes  : [{id, name}]
   lessons  : [{d:день 0-4, p:урок 0-7, c:class_id, t:teacher_id, s:предмет,
                g:підгрупа 0|1|null, w:тиждень null|0|1,
                priv:true?, sn:прізвище учня (для priv)}]
   subs     : [{d, p, c:class_id, s:предмет, from:teacher_id, to:teacher_id|null,
                action:"replace"|"cancel"|"shift", date:"2026-09-02"}]
   info     : текст банера (порожній рядок — банер не показується)
*/

/* ── Дзвінки ────────────────────────────────────────────── */
const BELLS = [
  ["08:00","08:45"], ["08:55","09:40"], ["10:05","10:50"], ["11:15","12:00"],
  ["12:15","13:00"], ["13:10","13:55"], ["14:00","14:45"], ["14:50","15:35"]
];
const DAYS  = ["ПОНЕДІЛОК","ВІВТОРОК","СЕРЕДА","ЧЕТВЕР","П'ЯТНИЦЯ"];
const DAYS_SHORT = ["Понеділок","Вівторок","Середа","Четвер","П'ятниця"];
const periodsForDay = d => (d === 4 ? 7 : 8);

const T = PAYLOAD.teachers, C = PAYLOAD.classes, L = PAYLOAD.lessons, S = PAYLOAD.subs || [];
const teacherById = Object.fromEntries(T.map(t => [t.id, t]));
const classById   = Object.fromEntries(C.map(c => [c.id, c]));

/* Скорочене ім'я: «Петренко Олексій Іванович» → «Петренко О.І.» */
function shortName(full){
  const p = String(full || "").trim().split(/\s+/);
  return p.length < 2 ? (full || "") : p[0] + " " + p.slice(1).map(x => x[0] + ".").join("");
}
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ── Індекси ───────────────────────────────────────────── */
const byTeacher = {}, byClass = {};
for (const ls of L){
  (byTeacher[ls.t] ||= []).push(ls);
  if (ls.c) (byClass[ls.c] ||= []).push(ls);
}
const subKey = (d,p,c) => d + "|" + p + "|" + c;
const subsAt = {};                       // (день,урок,клас) -> заміна
for (const s of S) (subsAt[subKey(s.d,s.p,s.c)] ||= []).push(s);

/* ── Поточний урок ─────────────────────────────────────── */
const toMin = hhmm => { const [h,m] = hhmm.split(":").map(Number); return h*60 + m; };
function currentSlot(){
  const now = new Date();
  const day = (now.getDay() + 6) % 7;               // 0 = понеділок
  if (day > 4) return null;                          // вихідні
  const mins = now.getHours()*60 + now.getMinutes();
  for (let p = 0; p < periodsForDay(day); p++){
    if (mins >= toMin(BELLS[p][0]) && mins <= toMin(BELLS[p][1])) return {day, period:p};
  }
  return null;
}
let NOW = currentSlot();

function renderNowLine(){
  const el = document.getElementById("nowLine");
  if (NOW){
    el.innerHTML = "Зараз: <b>" + (NOW.period + 1) + "-й урок</b> · " +
                   BELLS[NOW.period][0] + "–" + BELLS[NOW.period][1] +
                   " · " + DAYS_SHORT[NOW.day];
  } else {
    const now = new Date(), day = (now.getDay() + 6) % 7;
    el.textContent = day > 4 ? "Сьогодні вихідний" : "Зараз уроку немає (перерва або поза розкладом)";
  }
}

/* ── Комірка загальної таблиці ─────────────────────────── */
function classCode(ls){
  const nm = classById[ls.c]?.name || ls.c || "";
  /* Індивідуальний урок: у сітці — клас учня + позначка, щоб його не сплутали
     зі звичайним уроком того ж класу, який іде в цей самий час. */
  if (ls.priv) return (nm ? nm + " " : "") + "інд.";
  return nm + (ls.g != null ? "(" + (ls.g + 1) + ")" : "");
}
/* Повна назва індивідуального уроку: «11-А Бут» */
function privLabel(ls){
  const nm = classById[ls.c]?.name || ls.c || "";
  return [nm, ls.sn].filter(Boolean).join(" ") || "Індив.";
}
/* Два уроки в одній комірці ніколи не можна писати підряд — розділяємо явно. */
const SLOT_SEP = '<span class="sep">/</span>';
function masterCell(tid, d, p){
  const items = (byTeacher[tid] || []).filter(x => x.d === d && x.p === p);
  const full = items.filter(x => x.w == null);
  const num  = items.filter(x => x.w === 0);
  const den  = items.filter(x => x.w === 1);

  let html = "";
  const codes = arr => arr.map(x =>
    '<span class="cls" data-class="' + esc(x.c) + '">' + esc(classCode(x)) + '</span>'
  ).join(" / ");

  if (full.length)      html = codes(full);
  else if (num.length || den.length)
                        html = (num.length ? codes(num) : "—") + " ⁄ " + (den.length ? codes(den) : "—");

  /* 1. Власний урок цього вчителя віддали заміннику (він відсутній) */
  let dropped = "";
  for (const ls of items){
    for (const s of (subsAt[subKey(d, p, ls.c)] || [])){
      if (s.from === tid && s.action !== "shift"){
        dropped = s.action === "cancel" ? "Скасовано" : "Заміна";
      }
    }
  }
  if (html && dropped) html = '<span class="gone">' + html + '</span>' +
                              '<span class="badge">' + dropped + '</span>';

  /* 2. Цей учитель когось замінює у цьому слоті — незалежно від власних уроків.
        ⚠ Обов'язково через роздільник: без нього два класи зліплювались в одне
        нечитабельне «10-А11-А». */
  for (const s of S){
    if (s.d === d && s.p === p && s.to === tid){
      if (html) html += SLOT_SEP;
      html += '<span class="cls" data-class="' + esc(s.c) + '">' +
              esc(classById[s.c]?.name || s.c) + '</span><span class="badge">Заміна</span>';
    }
  }
  return html;
}

/* ── Загальна таблиця ──────────────────────────────────── */
function renderMaster(){
  const head = ['<thead><tr><th class="day corner">День</th><th class="num corner">№</th>'];
  for (const t of T){
    head.push('<th class="tcol' + (t.brk ? ' grp' : '') + '">' +
              '<span class="tname" data-teacher="' + esc(t.id) + '">' +
              esc(shortName(t.name)) + '</span></th>');
  }
  head.push("</tr></thead>");

  const body = ["<tbody>"];
  for (let d = 0; d < 5; d++){
    const n = periodsForDay(d);
    for (let p = 0; p < n; p++){
      const isNow = NOW && NOW.day === d && NOW.period === p;
      const cls = [p === 0 && d > 0 ? "daysep" : "", isNow ? "now" : ""].filter(Boolean).join(" ");
      body.push("<tr" + (cls ? ' class="' + cls + '"' : "") + ">");
      if (p === 0) body.push('<td class="day" rowspan="' + n + '">' + DAYS[d] + "</td>");
      body.push('<td class="num">' + (p + 1) + "</td>");
      for (const t of T)
        body.push('<td' + (t.brk ? ' class="grp"' : '') + '>' +
                  masterCell(t.id, d, p) + "</td>");
      body.push("</tr>");
    }
  }
  body.push("</tbody>");
  document.getElementById("master").innerHTML = head.join("") + body.join("");
}

/* ── Особистий розклад ─────────────────────────────────── */
function personalTable(rows, headers, mkCells, d, variant){
  if (!rows.length) return "";
  const out = ['<div class="daycard"><h3>' + DAYS_SHORT[d] + "</h3>",
               '<table class="pers ' + variant + '"><thead><tr>',
               headers.map(h => "<th>" + esc(h) + "</th>").join(""),
               "</tr></thead><tbody>"];
  for (const ls of rows){
    const isNow = NOW && NOW.day === d && NOW.period === ls.p;
    out.push("<tr" + (isNow ? ' class="now"' : "") + ">",
             '<td class="t">' + BELLS[ls.p][0] + "</td>",
             '<td class="n">' + (ls.p + 1) + "</td>",
             mkCells(ls), "</tr>");
  }
  out.push("</tbody></table></div>");
  return out.join("");
}
const WEEK_LABEL = ["1-3 тиждень", "2-4 тиждень"];   // 0 = чисельник, 1 = знаменник
function weekMark(ls){
  return ls.w == null ? "" :
    ' <small style="color:var(--muted)">(' + WEEK_LABEL[ls.w] + ")</small>";
}
const ACTION_LABEL = {replace: "Заміна", cancel: "Скасовано", shift: "Зсув"};
function subNote(ls){
  for (const s of (subsAt[subKey(ls.d, ls.p, ls.c)] || [])){
    if (s.from === ls.t || s.to === ls.t){
      return '<span class="badge">' + (ACTION_LABEL[s.action] || "Заміна") + "</span>";
    }
  }
  return "";
}

/* Розклад учителя = власні уроки + ті, які він ЗАМІНЯЄ. Останніх немає в
   lessons (там стоїть відсутній колега), тож без цього вчитель-замінник бачив
   свій звичайний день і жодного натяку на заміну. */
function teacherRows(id, d){
  const own = (byTeacher[id] || []).filter(x => x.d === d).map(ls => {
    const s = (subsAt[subKey(ls.d, ls.p, ls.c)] || []).find(x => x.from === id);
    return s ? {...ls, _gone: ACTION_LABEL[s.action] || "Заміна"} : ls;
  });
  const taken = S.filter(s => s.d === d && s.to === id).map(s => ({
    d: s.d, p: s.p, c: s.c, t: id, s: s.s, g: null, w: null, _cover: true,
  }));
  return [...own, ...taken].sort((a, b) => a.p - b.p);
}

function renderTeacher(id){
  const t = teacherById[id];
  if (!t) return;
  const out = ['<button class="back" data-back="teacher">← До пошуку</button>',
               '<div class="who">' + esc(t.name) + "</div>"];
  let any = false;
  for (let d = 0; d < 5; d++){
    const rows = teacherRows(id, d);
    if (rows.length) any = true;
    out.push(personalTable(rows, ["Час","№","Клас","Предмет"], ls => {
      const cls = '<span class="cls" data-class="' + esc(ls.c) + '">' +
                  esc(ls.priv ? privLabel(ls) : classCode(ls)) + "</span>";
      /* урок віддано заміннику — лишаємо видимим, але закреслено */
      const badge = ls._gone ? '<span class="badge">' + ls._gone + "</span>"
                  : ls._cover ? '<span class="badge">Заміна</span>'
                  : subNote(ls);
      const name = ls._gone ? '<span class="gone">' + esc(ls.s) + "</span>" : esc(ls.s);
      return "<td>" + cls + "</td><td>" + name + weekMark(ls) + badge + "</td>";
    }, d, "tv"));
  }
  if (!any) out.push('<div class="empty">Уроків не знайдено.</div>');
  document.getElementById("outTeacher").innerHTML = out.join("");
}

function renderClass(id){
  const c = classById[id];
  if (!c) return;
  const out = ['<button class="back" data-back="class">← До пошуку</button>',
               '<div class="who">' + esc(c.name) + "</div>"];
  let any = false;
  for (let d = 0; d < 5; d++){
    /* Індивідуальні уроки — не уроки класу: вони йдуть паралельно з ними
       й лише плутали б розклад. У сітці та в розкладі вчителя вони лишаються. */
    const rows = (byClass[id] || []).filter(x => x.d === d && !x.priv).sort((a,b) => a.p - b.p || (a.g ?? -1) - (b.g ?? -1));
    if (rows.length) any = true;
    out.push(personalTable(rows, ["Час","№","Предмет","Вчитель"], ls => {
      /* якщо є заміна — показуємо, хто фактично проводить урок */
      let tid = ls.t, note = "";
      for (const s of (subsAt[subKey(ls.d, ls.p, ls.c)] || [])){
        if (s.from === ls.t && s.to){ tid = s.to; note = '<span class="badge">Заміна</span>'; }
        else if (s.from === ls.t && s.action === "cancel"){ note = '<span class="badge">Скасовано</span>'; }
      }
      const nm = teacherById[tid]?.name || "";
      return "<td>" + esc(ls.s) + (ls.g != null ? " (гр. " + (ls.g + 1) + ")" : "") + weekMark(ls) + "</td>" +
             '<td><span class="tname" data-teacher="' + esc(tid) + '">' + esc(shortName(nm)) + "</span>" + note + "</td>";
    }, d, "cv"));
  }
  if (!any) out.push('<div class="empty">Уроків не знайдено.</div>');
  document.getElementById("outClass").innerHTML = out.join("");
}

/* ── Пошук із випадним списком ─────────────────────────── */
function setupSearch(inputId, ddId, items, labelOf, onPick, route){
  const inp = document.getElementById(inputId), dd = document.getElementById(ddId);
  const close = () => { dd.innerHTML = ""; };
  const open = q => {
    const s = q.trim().toLowerCase();
    const found = (s ? items.filter(i => labelOf(i).toLowerCase().includes(s)) : items).slice(0, 60);
    dd.innerHTML = found.length
      ? found.map(i => '<div data-id="' + esc(i.id) + '">' + esc(labelOf(i)) + "</div>").join("")
      : '<div style="color:var(--muted)">Нічого не знайдено</div>';
  };
  const choose = (id, push) => {
    const it = items.find(i => i.id === id);
    if (!it) return;
    inp.value = labelOf(it);
    close();
    onPick(id);
    if (push !== false) setHash("#" + route + "/" + encodeURIComponent(labelOf(it)));
  };
  inp.addEventListener("input", () => open(inp.value));
  inp.addEventListener("focus", () => open(inp.value));
  dd.addEventListener("click", e => {
    const el = e.target.closest("div[data-id]");
    if (el) choose(el.dataset.id, true);
  });
  document.addEventListener("click", e => {
    if (!e.target.closest("#" + inputId) && !e.target.closest("#" + ddId)) close();
  });
  return { pick: choose, reset(){ inp.value = ""; close(); } };
}

/* ── Вкладки ───────────────────────────────────────────── */
const VIEWS = { master:"view-master", teacher:"view-teacher", class:"view-class" };
function showTab(name, push){
  for (const [k, id] of Object.entries(VIEWS)) document.getElementById(id).hidden = (k !== name);
  document.querySelectorAll(".tab").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  window.scrollTo({ top:0, behavior:"smooth" });
  if (push !== false) setHash(name === "master" ? "#" : "#" + name);
}
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => showTab(b.dataset.tab)));

/* Повернути панель пошуку до початкового стану */
let searchT, searchC;
function resetPane(which, push){
  const isT = which === "teacher";
  document.getElementById(isT ? "outTeacher" : "outClass").innerHTML =
    '<div class="hint">Введіть ' + (isT ? "прізвище" : "назву класу") +
    " — зі списку оберіть потрібний варіант.</div>";
  (isT ? searchT : searchC).reset();
  if (push !== false) setHash("#" + which);
}

/* ── Маршрутизація через #hash (щоб стан сторінки можна було
      зберегти в закладки та відкрити назад/вперед) ─────────── */
let muteHash = false;                 // власна зміна hash не має викликати повторний рендер
function setHash(h){
  if (location.hash === h || (h === "#" && !location.hash)) return;
  muteHash = true;
  location.hash = h;
  setTimeout(() => { muteHash = false; }, 0);
}
function applyHash(){
  const raw  = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  const sep  = raw.indexOf("/");
  const kind = (sep === -1 ? raw : raw.slice(0, sep)).toLowerCase();
  const name = (sep === -1 ? "" : raw.slice(sep + 1)).trim();

  if (kind !== "teacher" && kind !== "class"){ showTab("master", false); return; }
  showTab(kind, false);
  const list = kind === "teacher" ? T : C;
  const item = name && list.find(i => i.name.toLowerCase() === name.toLowerCase());
  if (item) (kind === "teacher" ? searchT : searchC).pick(item.id, false);
  else resetPane(kind, false);
}
window.addEventListener("hashchange", () => { if (!muteHash) applyHash(); });

/* ── Клік по імені вчителя / назві класу ───────────────── */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-teacher]");
  if (t){ showTab("teacher", false); searchT.pick(t.dataset.teacher); return; }
  const c = e.target.closest("[data-class]");
  if (c && c.dataset.class){ showTab("class", false); searchC.pick(c.dataset.class); return; }
  const b = e.target.closest("[data-back]");
  if (b) resetPane(b.dataset.back);
});

/* ── Перемикач теми ────────────────────────────────────── */
const THEME_MAX_AGE = 60 * 60 * 24 * 365;          // рік
const themeBtn = document.getElementById("theme");
const isDark = () => document.documentElement.getAttribute("data-theme") === "dark";
const themeChosen = () => /(?:^|;\s*)theme=(light|dark)/.test(document.cookie);

function paintThemeBtn(){
  themeBtn.textContent = isDark() ? "☀️" : "🌙";
  themeBtn.title = isDark() ? "Світла тема" : "Темна тема";
  themeBtn.setAttribute("aria-label", themeBtn.title);
}
function setTheme(t, remember){
  document.documentElement.setAttribute("data-theme", t);
  if (remember){
    document.cookie = "theme=" + t + ";path=/;max-age=" + THEME_MAX_AGE + ";SameSite=Lax";
  }
  paintThemeBtn();
}
themeBtn.addEventListener("click", () => setTheme(isDark() ? "light" : "dark", true));

/* Поки користувач нічого не обрав — слухаємось системи навіть на льоту
   (телефон сам вмикає темну ввечері). Після вибору — більше не втручаємось. */
if (window.matchMedia){
  const mq = matchMedia("(prefers-color-scheme:dark)");
  const follow = e => { if (!themeChosen()) setTheme(e.matches ? "dark" : "light", false); };
  mq.addEventListener ? mq.addEventListener("change", follow) : mq.addListener(follow);
}

/* ── Старт ─────────────────────────────────────────────── */
function boot(){
  paintThemeBtn();
  if (PAYLOAD.info && PAYLOAD.info.trim()){
    document.getElementById("banner").innerHTML =
      '<div class="banner"><span class="ico">ℹ️</span><span>' + esc(PAYLOAD.info) + "</span></div>";
  }
  renderNowLine();
  renderMaster();
  const gradeKey = n => {
    const m = String(n).match(/^\s*(\d+)/);
    return [m ? +m[1] : 99, String(n)];
  };
  const sortedC = [...C].sort((a,b) => {
    const [ga,na] = gradeKey(a.name), [gb,nb] = gradeKey(b.name);
    return ga - gb || na.localeCompare(nb, "uk");
  });
  const sortedT = [...T].sort((a,b) => a.name.localeCompare(b.name, "uk"));
  searchT = setupSearch("qTeacher", "ddTeacher", sortedT, t => t.name, renderTeacher, "teacher");
  searchC = setupSearch("qClass",   "ddClass",   sortedC, c => c.name, renderClass,   "class");
  const stamp = [];
  if (PAYLOAD.generated) stamp.push("Розклад сформовано: " + PAYLOAD.generated);
  if (PAYLOAD.built)     stamp.push("Сторінку оновлено: " + PAYLOAD.built);
  document.getElementById("stamp").textContent = stamp.join(" · ");

  applyHash();              // відкрити стан із закладки (#teacher/… , #class/9-А)

  /* Перерахунок підсвітки поточного уроку раз на хвилину */
  setInterval(() => {
    const prev = JSON.stringify(NOW);
    NOW = currentSlot();
    if (JSON.stringify(NOW) !== prev){
      renderNowLine();
      renderMaster();
    }
  }, 60000);
}
boot();
</script>
